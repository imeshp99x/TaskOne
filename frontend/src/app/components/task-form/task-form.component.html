<div class="task-form-panel">
  <div class="panel-header">
    <h2>{{ isEditMode ? 'Edit Task' : 'New Task' }}</h2>
    <span class="mode-badge" [class.edit-badge]="isEditMode">
      {{ isEditMode ? '✏️ Editing' : '➕ Creating' }}
    </span>
  </div>

  <div class="alert alert-success" *ngIf="successMessage">
    ✓ {{ successMessage }}
  </div>
  <div class="alert alert-error" *ngIf="errorMessage">
    ✗ {{ errorMessage }}
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <!-- Title -->
    <div class="form-group" [class.has-error]="f.title.invalid && f.title.touched">
      <label for="title">Title <span class="required">*</span></label>
      <input
        id="title"
        type="text"
        formControlName="title"
        placeholder="Enter task title"
      />
      <span class="error-text" *ngIf="f.title.invalid && f.title.touched">
        <ng-container *ngIf="f.title.errors?.required">Title is required.</ng-container>
        <ng-container *ngIf="f.title.errors?.minlength">At least 2 characters required.</ng-container>
        <ng-container *ngIf="f.title.errors?.maxlength">Maximum 200 characters allowed.</ng-container>
      </span>
    </div>

    <!-- Description -->
    <div class="form-group" [class.has-error]="f.description.invalid && f.description.touched">
      <label for="description">Description</label>
      <textarea
        id="description"
        formControlName="description"
        placeholder="Enter task description (optional)"
        rows="3"
      ></textarea>
      <span class="error-text" *ngIf="f.description.invalid && f.description.touched">
        <ng-container *ngIf="f.description.errors?.maxlength">Maximum 1000 characters allowed.</ng-container>
      </span>
    </div>

    <!-- Status -->
    <div class="form-group">
      <label for="status">Status <span class="required">*</span></label>
      <select id="status" formControlName="status">
        <option *ngFor="let s of statusOptions" [value]="s.value">{{ s.label }}</option>
      </select>
    </div>

    <!-- Due Date -->
    <div class="form-group">
      <label for="dueDate">Due Date</label>
      <input
        id="dueDate"
        type="date"
        formControlName="dueDate"
      />
    </div>

    <!-- Assignee -->
    <div class="form-group">
      <label for="assigneeId">Assignee</label>
      <select id="assigneeId" formControlName="assigneeId">
        <option [value]="null">— Unassigned —</option>
        <option *ngFor="let u of users" [value]="u.id">{{ u.fullName }}</option>
      </select>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="loading">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Saving...' : (isEditMode ? 'Update Task' : 'Create Task') }}
      </button>
      <button
        *ngIf="isEditMode"
        type="button"
        class="btn btn-secondary"
        (click)="onCancel()">
        Cancel
      </button>
    </div>
  </form>
</div>
